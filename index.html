<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מרכז המדריכים</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#141821; --panel-2:#1b202b;
    --line:#262c39; --txt:#e7ecf3; --muted:#8b93a4;
    --gold:#c8a45e; --gold-dim:#8a7440; --user:#1f6feb; --ok:#2ea043;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--txt);
    display:flex;flex-direction:column;height:100vh}
  header{padding:12px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#12151d,#0d0f14);
    display:flex;align-items:center;justify-content:space-between;gap:14px}
  header .title{display:flex;align-items:center;gap:12px}
  header h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.3px}
  header .logo{width:34px;height:34px;border-radius:9px;
    background:linear-gradient(135deg,var(--gold),var(--gold-dim));
    display:flex;align-items:center;justify-content:center;color:#0d0f14;font-weight:800;font-size:18px}
  .right{display:flex;align-items:center;gap:14px}
  .stats{font-size:12.5px;color:var(--muted)} .stats b{color:var(--gold)}
  .upload-btn{background:rgba(200,164,94,.1);border:1px solid var(--gold-dim);color:var(--gold);
    padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;
    font-family:inherit;white-space:nowrap;transition:.15s}
  .upload-btn:hover{background:rgba(200,164,94,.18)}
  main{flex:1;overflow-y:auto;padding:24px 0}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px}
  .msg{display:flex;gap:12px;margin-bottom:22px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .avatar{width:34px;height:34px;border-radius:9px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
  .msg.user .avatar{background:var(--user);color:#fff}
  .msg.bot .avatar{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#0d0f14}
  .msg.sys .avatar{background:var(--ok);color:#fff}
  .bubble{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:13px 16px;line-height:1.75;font-size:15px;white-space:pre-wrap;word-wrap:break-word;max-width:100%}
  .msg.user .bubble{background:var(--panel-2)}
  .msg.sys .bubble{background:rgba(46,160,67,.08);border-color:rgba(46,160,67,.4)}
  .sources{margin-top:10px;display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:12px;color:var(--gold);background:rgba(200,164,94,.09);
    border:1px solid var(--gold-dim);padding:3px 10px;border-radius:999px}
  .hint{text-align:center;color:var(--muted);margin-top:40px;font-size:14.5px;line-height:1.9}
  .hint .big{font-size:17px;color:var(--txt);margin-bottom:6px}
  footer{border-top:1px solid var(--line);background:#0f1219;padding:14px 0}
  .composer{max-width:820px;margin:0 auto;padding:0 18px;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;background:var(--panel);color:var(--txt);
    border:1px solid var(--line);border-radius:12px;padding:12px 15px;
    font-family:inherit;font-size:15px;line-height:1.6;max-height:140px;outline:none}
  textarea:focus{border-color:var(--gold-dim)}
  button.send{background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:#0d0f14;
    border:none;border-radius:12px;padding:0 20px;height:46px;font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
  button.send:hover{filter:brightness(1.08)}
  button.send:disabled{opacity:.5;cursor:not-allowed}
  .typing{display:inline-block;color:var(--muted)}
  .typing::after{content:"▋";animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}
  /* Drag overlay */
  #drop{position:fixed;inset:0;background:rgba(13,15,20,.92);z-index:50;
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    border:3px dashed var(--gold);border-radius:0}
  #drop.show{display:flex}
  #drop .big{font-size:24px;color:var(--gold);font-weight:700}
  #drop .sub{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="title"><div class="logo">מ</div><h1>מרכז המדריכים</h1></div>
  <div class="right">
    <span class="stats" id="stats">טוען...</span>
    <button class="upload-btn" id="uploadBtn">➕ העלה מדריך</button>
    <input type="file" id="fileInput" multiple accept=".pdf,.docx,.png,.jpg,.jpeg,.webp,.txt,.md" style="display:none">
  </div>
</header>

<main id="main">
  <div class="wrap" id="chat">
    <div class="hint" id="hint">
      <div class="big">שאל אותי כל דבר על המדריכים 📚</div>
      גרור לכאן מדריכים (או לחץ "➕ העלה מדריך"), ואז שאל בעברית.<br>
      לדוגמה: "איך נכנסים למסך הפקדות?" · "איפה לוחצים כדי לאפס סיסמה?"
    </div>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="כתוב שאלה בעברית..."></textarea>
    <button class="send" id="sendBtn">שלח</button>
  </div>
</footer>

<div id="drop"><div class="big">שחרר כאן כדי להעלות מדריך 📄</div><div class="sub">PDF · Word · תמונות · טקסט</div></div>

<script>
const chat=document.getElementById('chat'), input=document.getElementById('input'),
      btn=document.getElementById('sendBtn'), main=document.getElementById('main'),
      hint=document.getElementById('hint'), stats=document.getElementById('stats'),
      uploadBtn=document.getElementById('uploadBtn'), fileInput=document.getElementById('fileInput'),
      drop=document.getElementById('drop');

function refreshStats(){
  fetch('/api/sources').then(r=>r.json()).then(d=>{
    stats.innerHTML = d.sources.length + " מדריכים · <b>"+d.chunks+"</b> קטעים";
  }).catch(()=>{stats.textContent="";});
}
refreshStats();

input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
btn.addEventListener('click',send);
uploadBtn.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{ handleFiles(fileInput.files); fileInput.value=''; });

// גרירה
let dragCount=0;
window.addEventListener('dragenter',e=>{e.preventDefault();dragCount++;drop.classList.add('show');});
window.addEventListener('dragover',e=>{e.preventDefault();});
window.addEventListener('dragleave',e=>{e.preventDefault();dragCount--;if(dragCount<=0)drop.classList.remove('show');});
window.addEventListener('drop',e=>{e.preventDefault();dragCount=0;drop.classList.remove('show');
  if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);});

function addMsg(role){
  const msg=document.createElement('div'); msg.className='msg '+role;
  const av=document.createElement('div'); av.className='avatar';
  av.textContent = role==='user'?'א':(role==='sys'?'✓':'מ');
  const bubble=document.createElement('div'); bubble.className='bubble';
  msg.appendChild(av); msg.appendChild(bubble); chat.appendChild(msg);
  main.scrollTop=main.scrollHeight; return bubble;
}

function readAsBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]); // רק החלק אחרי הפסיק
    r.onerror=()=>rej(new Error('קריאת קובץ נכשלה'));
    r.readAsDataURL(file);
  });
}

async function handleFiles(files){
  if(hint) hint.remove();
  for(const file of files){
    const bubble=addMsg('sys');
    bubble.innerHTML='מעלה ומעבד את <b>'+file.name+'</b> <span class="typing"></span>';
    try{
      const b64=await readAsBase64(file);
      const res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({filename:file.name, data:b64})});
      const d=await res.json();
      if(!res.ok||!d.ok){ bubble.innerHTML='⚠️ '+file.name+' — '+(d.error||'העלאה נכשלה'); continue; }
      bubble.innerHTML='נוסף למאגר: <b>'+file.name+'</b> ('+d.added+' קטעים) ✓';
      refreshStats();
    }catch(e){ bubble.innerHTML='⚠️ '+file.name+' — '+e.message; }
  }
}

async function send(){
  const text=input.value.trim(); if(!text) return;
  if(hint) hint.remove();
  input.value=''; input.style.height='auto'; btn.disabled=true;
  addMsg('user').textContent=text;
  const bubble=addMsg('bot'); bubble.innerHTML='<span class="typing"></span>';
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text})});
    const data=await res.json();
    if(!res.ok){ bubble.textContent='⚠️ '+(data.error||'שגיאה'); btn.disabled=false; return; }
    bubble.textContent=data.answer||'לא התקבלה תשובה.';
    if(data.sources&&data.sources.length){
      const s=document.createElement('div'); s.className='sources';
      data.sources.forEach(x=>{const c=document.createElement('span');c.className='chip';c.textContent='📄 '+x;s.appendChild(c);});
      bubble.parentElement.appendChild(s);
    }
  }catch(e){ bubble.textContent='⚠️ שגיאת רשת: '+e.message; }
  btn.disabled=false; main.scrollTop=main.scrollHeight; input.focus();
}
</script>
</body>
</html>
